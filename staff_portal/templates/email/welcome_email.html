<!doctype html>
<html>
  <body style="font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin:0; padding:24px; background:#f6f8fa;">
    <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
      <tr>
        <td align="center">
          <table width="600" cellpadding="0" cellspacing="0" role="presentation" style="background:#ffffff;border-radius:8px;overflow:hidden">
            <tr>
              <td style="padding:24px 24px 0 24px">
                <h2 style="margin:0 0 8px 0;color:#111">Welcome, {{ user.get_full_name|default:user.username }}!</h2>
                <p style="margin:0;color:#555">Your Seshibo Daily Market account is now <strong>active</strong>.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 24px 24px 24px">
                <p style="margin:0 0 16px 0;color:#555">Click below to sign in:</p>
                <p style="margin:0">
                  <a href="{{ login_url }}" style="display:inline-block;text-decoration:none;padding:10px 16px;border-radius:6px;background:#0b5c39;color:#fff;">
                    Go to login
                  </a>
                </p>
                <p style="margin:16px 0 0 0;color:#555;word-break:break-all;">Or paste into your browser:<br>{{ login_url }}</p>
              </td>
            </tr>
            <tr>
              <td style="background:#f0f2f4;color:#666;padding:12px 24px;font-size:12px">
                Seshibo Daily Market
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
