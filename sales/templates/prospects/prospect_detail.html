{% load static humanize %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prospects - Seshibo Daily Market</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root{
      --sidebar-w: 220px;
      --mobile-nav-h: 56px;
      --brand-green: #0b5c39;
      --content-bg: #f8f9fa;
    }
    html, body { height: 100%; }

    /* Sidebar skin */
    .sidebar-skin { background-color: var(--brand-green); color: #fff; padding: 1rem; }
    .sidebar-skin .nav-link { color: #fff; margin: .25rem 0; display: block; }
    .sidebar-skin .nav-link.active,
    .sidebar-skin .nav-link:hover { background: rgba(255,255,255,0.15); border-radius: 4px; padding-left: 8px; }
    .logo-img { max-height: 80px; width: auto; }

    /* Nested links + remove caret/arrow on collapses */
    .sidebar-skin .nav-link.ps-4 { font-size:.95rem; opacity:.95; }
    .nav-link[data-bs-toggle="collapse"]::after { content: none !important; }

    /* Content */
    .content { background: var(--content-bg); padding:20px; }
    .card { box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    .meta { font-size:12px; color:#6c757d; }
    .badge-cat { background:#e9f7f0; color:#0b5c39; border:1px solid #cfe9df; }

    /* Definition list grid */
    @media (min-width:768px){
      .dl-grid { display:grid; grid-template-columns:200px 1fr; row-gap:.25rem; }
      .dl-grid dt { grid-column:1; }
      .dl-grid dd { grid-column:2; }
    }

    /* Desktop: fixed sidebar, content scrolls */
    @media (min-width: 992px) {
      body { display:block; overflow:hidden; }
      .sidebar-desktop {
        position:fixed; top:0; left:0; bottom:0; width:var(--sidebar-w);
        overflow-y:auto; z-index:1020;
      }
      .content { margin-left:var(--sidebar-w); height:100vh; overflow:auto; -webkit-overflow-scrolling:touch; }
    }

    /* Mobile: fixed top bar, content scrolls under */
    @media (max-width: 991.98px) {
      html, body { height:100%; overflow:hidden; }
      .navbar.d-lg-none { position:fixed; top:0; left:0; right:0; z-index:1040; }
      .content { margin-top:var(--mobile-nav-h); height:calc(100vh - var(--mobile-nav-h)); overflow:auto; -webkit-overflow-scrolling:touch; }
    }
  </style>
</head>
<body>

  <!-- MOBILE/TABLET TOP BAR -->
  <nav class="navbar navbar-dark d-lg-none" style="background:#0b5c39;">
    <div class="container-fluid">
      <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileMenu" aria-controls="mobileMenu" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <a class="navbar-brand ms-2" href="#">
        <img src="{% static 'images/logo.png' %}" alt="Seshibo Daily Market" style="height:40px;">
      </a>
    </div>
  </nav>

  <!-- MOBILE OFFCANVAS MENU -->
  <div class="offcanvas offcanvas-start d-lg-none" tabindex="-1" id="mobileMenu" aria-labelledby="mobileMenuLabel">
    <div class="offcanvas-header sidebar-skin">
      <h5 class="offcanvas-title" id="mobileMenuLabel">Sales Menu</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body sidebar-skin">
      <div class="text-center mb-3">
        <img src="{% static 'images/logo.png' %}" alt="Seshibo Daily Market" class="logo-img">
      </div>

      <a href="{% url 'sales:sales-dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'sales-dashboard' %}active{% endif %}">Dashboard</a>
      <a href="{% url 'sales:sales-prospects' %}" class="nav-link {% if request.resolver_match.url_name == 'sales-prospects' %}active{% endif %}">Prospects</a>
      <a href="{% url 'sales:sales-clients' %}" class="nav-link {% if request.resolver_match.url_name == 'sales-clients' %}active{% endif %}">Clients</a>
      <a href="{% url 'sales:sales-orders' %}" class="nav-link {% if request.resolver_match.url_name == 'sales-orders' %}active{% endif %}">Orders</a>
      <a href="{% url 'sales:sales-invoices' %}" class="nav-link {% if request.resolver_match.url_name == 'sales-invoices' %}active{% endif %}">Invoices</a>
      <a href="{% url 'sales:sales-commission' %}" class="nav-link {% if request.resolver_match.url_name == 'sales-commission' %}active{% endif %}">Commission</a>
      <a href="{% url 'sales:sales-tickets' %}" class="nav-link {% if request.resolver_match.url_name == 'sales-tickets' %}active{% endif %}">Tickets &amp; Tasks</a>
      <hr class="border-light">
      <form action="{% url 'logout' %}" method="post" class="m-0">
        {% csrf_token %}
        <button type="submit" class="btn btn-light w-100">Sign out</button>
      </form>
    </div>
  </div>

  <!-- DESKTOP SIDEBAR -->
  <aside class="sidebar-desktop d-none d-lg-block sidebar-skin">
    <div class="text-center mb-3">
      <img src="{% static 'images/logo.png' %}" alt="Seshibo Daily Market" class="logo-img">
    </div>

    <a href="{% url 'sales:sales-dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'sales-dashboard' %}active{% endif %}">Dashboard</a>
    <a href="{% url 'sales:sales-prospects' %}" class="nav-link {% if request.resolver_match.url_name == 'sales-prospects' %}active{% endif %}">Prospects</a>
    <a href="{% url 'sales:sales-clients' %}" class="nav-link {% if request.resolver_match.url_name == 'sales-clients' %}active{% endif %}">Clients</a>
    <a href="{% url 'sales:sales-orders' %}" class="nav-link {% if request.resolver_match.url_name == 'sales-orders' %}active{% endif %}">Orders</a>
    <a href="{% url 'sales:sales-invoices' %}" class="nav-link {% if request.resolver_match.url_name == 'sales-invoices' %}active{% endif %}">Invoices</a>
    <a href="{% url 'sales:sales-commission' %}" class="nav-link {% if request.resolver_match.url_name == 'sales-commission' %}active{% endif %}">Commission</a>
    <a href="{% url 'sales:sales-tickets' %}" class="nav-link {% if request.resolver_match.url_name == 'sales-tickets' %}active{% endif %}">Tickets &amp; Tasks</a>
    <div class="mt-3">
      <form action="{% url 'logout' %}" method="post" class="m-0 p-0">
        {% csrf_token %}
        <button type="submit" class="nav-link w-100 text-start btn btn-link p-0 text-white">Sign out</button>
      </form>
    </div>
  </aside>

    <!-- MAIN CONTENT -->
    <main class="content">
