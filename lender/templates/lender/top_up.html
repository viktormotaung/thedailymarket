{% load static humanize %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Top up via PayFast · {{ funder.name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root{ --brand:#0b5c39; }
    .navbar{ background: var(--brand); }
    .navbar .navbar-brand, .navbar .nav-link{ color:#fff !important; }
    .card{ border-radius:1rem; }
  </style>
</head>
<body>
<nav class="navbar">
  <div class="container d-flex justify-content-between">
    <a class="navbar-brand" href="{% url 'funder-dashboard' %}?funder={{ funder.id }}">
      {{ funder.name }} · Top up
    </a>
  </div>
</nav>

<main class="py-4">
  <div class="container" style="max-width:720px">
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="mb-3">Top up via PayFast</h5>
        <p class="text-muted mb-4">Enter the amount you’d like to add to <strong>{{ funder.name }}</strong>.</p>

        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Amount (R)</label>
            <input type="number" name="amount" step="0.01" min="0.01" class="form-control" required>
          </div>
          <div class="d-flex gap-2">
            <a href="{% url 'funder-dashboard' %}?funder={{ funder.id }}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-success">Pay with PayFast</button>
          </div>
        </form>

        <div class="small text-muted mt-3">
          Current balance: R{{ funder.balance|floatformat:2|intcomma }}
        </div>
      </div>
    </div>
  </div>
</main>
</body>
</html>
